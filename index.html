<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Where They Began | Origin Stories on YouTube</title>
    <meta
      name="description"
      content="Where They Began tells origin stories of creators, innovators, and athletes. One life. One Sunday. No host. A movie. New episode every week"
    />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <link rel="canonical" href="https://wheretheybegan.com" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wheretheybegan.com" />
    <meta property="og:title" content="Where They Began | Origin Stories on YouTube" />
    <meta
      property="og:description"
      content="Where They Began tells origin stories of creators, innovators, and athletes. One life. One Sunday. No host. A movie. New episode every week"
    />
    <meta property="og:site_name" content="Where They Began" />
    <meta name="theme-color" content="#0a0a0a" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero" aria-labelledby="site-title">
        <div class="brand-banner" role="img" aria-label="Where They Began visual mark">
          <h1 id="site-title" class="wordmark">Where They Began</h1>
          <div class="gold-rule" aria-hidden="true"></div>
          <p class="series-label">ORIGIN STORIES</p>
        </div>

        <div class="channel-row">
          <div class="avatar" aria-hidden="true">
            <span class="avatar-text">WTB</span>
            <span class="avatar-rule"></span>
          </div>

          <div class="channel-copy">
            <p class="display-name">WhereTheyBegan</p>
            <p class="handle">@WhereTheyBegan</p>
            <p class="description">
              Where They Began tells origin stories of creators, innovators, and athletes.
              One life. One Sunday. No host. A movie. New episode every week
            </p>
          </div>
        </div>

        <div class="cta-group">
          <a
            class="btn btn-primary"
            href="https://www.youtube.com/@wheretheybegan?sub_confirmation=1"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Subscribe to Where They Began on YouTube"
            >Subscribe on YouTube</a
          >
          <a
            class="btn btn-secondary"
            href="https://www.youtube.com/@wheretheybegan"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Watch Where They Began on YouTube"
            >Watch on YouTube</a
          >
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>© Where They Began</p>
      <a
        href="https://www.youtube.com/@wheretheybegan"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Visit the official Where They Began YouTube channel"
        >YouTube</a
      >
    </footer>
  </body>
</html>
